<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar Contraseña</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.recovery-container{
    background:white;
    width:380px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:80px;
    border-radius:50%;
}

h1{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:20px;
}

p{
    text-align:center;
    margin-bottom:20px;
    color:#555;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.message{
    margin-top:15px;
    text-align:center;
    color:green;
    font-weight:bold;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#2563eb;
    text-decoration:none;
}

.links a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="recovery-container">

    <div class="logo">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzjTiIyitFAs1OQ_0CuBORp4rO-zUSvNZ6Eg&s" alt="Logo">
    </div>

    <h1>Recuperar Contraseña</h1>

    <p>
        Ingresa tu correo electrónico para recuperar tu cuenta.
    </p>

    <form onsubmit="recuperar(event)">

        <div class="input-group">
            <label>Correo electrónico</label>
            <input type="email" id="correo" required>
        </div>

        <button type="submit">
            Enviar enlace de recuperación
        </button>

        <div class="message" id="mensaje"></div>

    </form>

    <div class="links">
        <a href="login.html">Volver al inicio de sesión</a>
    </div>

</div>

<script>

function recuperar(event){

    event.preventDefault();

    let correo = document.getElementById("correo").value;

    document.getElementById("mensaje").innerHTML =
    "Se envió un enlace de recuperación a: " + correo;

}

</script>

</body>
</html>
