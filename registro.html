<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Cuenta - JRT</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.register-container{
    background:white;
    width:400px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:80px;
    border-radius:50%;
}

h1{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#2563eb;
    text-decoration:none;
}

.links a:hover{
    text-decoration:underline;
}

.success{
    margin-top:15px;
    text-align:center;
    color:green;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="register-container">

    <div class="logo">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzjTiIyitFAs1OQ_0CuBORp4rO-zUSvNZ6Eg&s" alt="Logo">
    </div>

    <h1>Crear Cuenta</h1>

    <form onsubmit="crearCuenta(event)">

        <div class="input-group">
            <label>Nombre completo</label>
            <input type="text" id="nombre" required>
        </div>

        <div class="input-group">
            <label>Correo electrónico</label>
            <input type="email" id="correo" required>
        </div>

        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="contrasena" required>
        </div>

        <div class="input-group">
            <label>Confirmar contraseña</label>
            <input type="password" id="confirmar" required>
        </div>

        <button type="submit">Crear Cuenta</button>

        <div class="success" id="mensaje"></div>

    </form>

    <div class="links">
        <a href="login.html">Ya tengo cuenta</a>
    </div>

</div>

<script>

function crearCuenta(event){

    event.preventDefault();

    let nombre = document.getElementById("nombre").value;
    let correo = document.getElementById("correo").value;
    let contrasena = document.getElementById("contrasena").value;
    let confirmar = document.getElementById("confirmar").value;

    if(contrasena !== confirmar){
        alert("Las contraseñas no coinciden");
        return;
    }

    document.getElementById("mensaje").innerHTML =
    "Cuenta creada correctamente";

}

</script>

</body>
</html>
